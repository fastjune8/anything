<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRONTIER 총기 뷰어</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<link rel="stylesheet" href="./editor.css">
<link rel="stylesheet" href="./guns.css">
</head>
<body>
<header>
  <b class="logo">FRONT<em>IER</em> 총기 뷰어</b>
  <a class="navlink" href="./">맵 에디터 →</a>
  <span class="sep"></span>
  <select id="savedSel" title="프로젝트에 저장된 총"><option value="">저장된 총 열기…</option></select>
  <button id="openFile" type="button">.glb 파일 열기</button>
  <button id="sample" type="button" title="규칙대로 만든 예시 모델 (어떻게 만들어야 하는지 보기)">예시 총</button>
  <input id="fileIn" type="file" accept=".glb,model/gltf-binary" hidden>
  <span id="fileName"></span>
  <span class="grow"></span>
  <input id="gunId" type="text" placeholder="총 id (예: vk12)" title="영문 소문자·숫자·_ (content/guns/<id>.glb 로 저장)" size="14">
  <button id="saveGun" type="button" class="primary" disabled title="검사를 통과하면 프로젝트(content/guns)에 저장">프로젝트에 저장</button>
</header>
<main>
  <aside id="left">
    <h3>보기</h3>
    <div class="seg" id="views">
      <button type="button" data-view="orbit" class="on">살펴보기</button>
      <button type="button" data-view="hip">1인칭</button>
      <button type="button" data-view="ads">정조준</button>
    </div>
    <h3>표시</h3>
    <label class="tog"><input id="showSockets" type="checkbox" checked> 부착 지점</label>
    <label class="tog"><input id="showWire" type="checkbox"> 와이어프레임</label>
    <label class="tog"><input id="showArms" type="checkbox" checked> 팔 (1인칭)</label>
    <label class="tog"><input id="spin" type="checkbox"> 천천히 돌리기</label>
    <h3>크기 비교 (지금 게임의 총)</h3>
    <select id="ghostSel"><option value="">없음</option></select>
    <h3>파츠 달아 보기</h3>
    <div id="partSels"></div>
    <h3>스킨 (색 칸)</h3>
    <select id="skinSel"></select>
    <div id="slotList"></div>
  </aside>
  <section id="stage">
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="drop"><div><b>.glb 파일을 여기에 끌어다 놓으세요</b><span>Blender → 내보내기 → glTF 2.0 (.glb) · 규칙은 docs/GUN_MODELING.md</span></div></div>
    <div id="flash" hidden></div>
    <div id="viewHint"></div>
  </section>
  <aside id="props">
    <h2>규칙 검사</h2>
    <div id="checks"><p class="note">모델을 열면 여기에 결과가 나옵니다.</p></div>
    <h2>부착 지점</h2>
    <div id="socketList"></div>
  </aside>
</main>
<script type="module" src="./guns.js"></script>
</body>
</html>
