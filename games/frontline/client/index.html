<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRONTIER</title>
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="envtag"></div>

<div id="hud">
  <div id="vig"></div>
  <div id="scope"><b></b></div>
  <div id="cross"><i class="h l"></i><i class="h r"></i><i class="v t"></i><i class="v b"></i><i class="c"></i></div>
  <div id="hitm"></div>
  <div id="dmgnums"></div>
  <div id="dmgdir"></div>
  <div id="rbar"><i></i></div>

  <!-- 위: 점수 · 시간 · 거점 -->
  <div id="top"><span class="sc a mono" id="scA">0</span><div class="mid"><span id="timer" class="mono">10:00</span><span id="goal"></span><div id="zones"></div></div><span class="sc e mono" id="scE">0</span></div>
  <div id="zonebox"><div class="zt"><b id="zoneName">거점</b><span id="zoneState"></span></div><div class="zbar"><i></i></div></div>
  <div id="zmarks"></div>
  <div id="roomtag"></div>
  <canvas id="minimap" width="170" height="170"></canvas>
  <canvas id="tactical"></canvas>
  <div id="banner"></div>
  <div id="prot"></div>
  <div id="feed"></div>
  <div id="board"></div>
  <div id="chat"><div id="chatLog"></div><input id="chatIn" type="text" maxlength="120" placeholder="메시지 입력 · Enter 전송 · Esc 취소" autocomplete="off"></div>

  <!-- 아래: 체력 · 무기 · 탄약 · 스킬 -->
  <div id="hp"><div class="row"><span class="v mono" id="hpV">150</span><span class="l">HP</span></div><div class="bar"><i id="hpB"></i></div></div>
  <div id="slots"></div>
  <div id="skills"></div>
  <div id="ammo"><div><span class="cur mono" id="amC">30</span><span class="res mono" id="amR">/ 30</span></div><div class="wn" id="wN"></div><div class="wc" id="wC"></div></div>

  <div id="dead"></div>
  <div id="endscr"></div>
</div>

<!-- 로비 -->
<div class="overlay" id="menu">
  <div class="lobby">
    <header>
      <h1>FRONT<em>IER</em></h1>
      <div class="me">
        <div class="who"><b id="meName">…</b><small id="meTag"></small><span id="meLv" class="lv"></span></div>
        <div class="xpbar"><i id="meXp"></i></div><small id="meXpT"></small> · <small id="meSum"></small>
      </div>
      <div class="mebtn"><button type="button" id="meEdit" class="small ghost">이름 변경</button><button type="button" id="meCopy" class="small ghost">친구 코드 복사</button><button type="button" id="meStats" class="small">전적</button></div>
    </header>
    <div class="cols">
      <section class="play">
        <div id="tabs"><button type="button" data-tab="quick" class="on">빠른 매칭</button><button type="button" data-tab="custom">커스텀 방</button></div>
        <div id="paneQuick">
          <div id="modes"></div>
          <button id="join" type="button">빠른 매칭</button>
          <p class="dim small">사람이 모자라면 봇이 채워서 바로 시작됩니다</p>
        </div>
        <div id="paneCustom" hidden>
          <div class="phead"><b>열린 방</b><span id="roomEmpty">열린 방이 없습니다</span><button type="button" id="roomRefresh" class="small ghost">새로고침</button></div>
          <div id="roomList"></div>
          <div class="codejoin"><input type="text" id="codeIn" maxlength="4" placeholder="방 코드" autocomplete="off" spellcheck="false"><input type="password" id="passIn" maxlength="16" placeholder="비밀번호 (있으면)" autocomplete="off"><button type="button" id="codeJoin">입장</button></div>
          <div class="phead"><b>방 만들기</b></div>
          <form id="createForm">
            <input type="text" id="cName" maxlength="20" placeholder="방 이름" autocomplete="off">
            <div class="row2"><label>모드 <select id="cMode"></select></label><label>맵 <select id="cMap"></select></label></div>
            <div class="row2"><label>시간 <select id="cMin"><option value="5">5분</option><option value="8">8분</option><option value="10" selected>10분</option><option value="15">15분</option></select></label>
              <label>인원 <select id="cMax"><option value="2">2명</option><option value="4">4명</option><option value="6">6명</option><option value="8">8명</option><option value="10" selected>10명</option></select></label></div>
            <div class="row2"><input type="password" id="cPass" maxlength="16" placeholder="비밀번호 (비우면 공개)" autocomplete="off"><label class="chk"><input type="checkbox" id="cBots" checked> 봇으로 채우기</label></div>
            <button type="submit">방 만들고 입장</button>
          </form>
        </div>
        <div id="msg"></div>
      </section>
      <section class="kit">
        <div class="ktabs"><button type="button" data-lt="loadout" class="on">출전 무기 · 스킬</button><button type="button" data-lt="outfit">외형</button></div>
        <div id="ltLoadout"><div id="slot0" class="slotbox"></div><div id="slot1" class="slotbox"></div></div>
        <div id="ltOutfit" hidden><div id="outfitBox"></div></div>
      </section>
      <section class="social">
        <h3>파티</h3><div id="partyBox"></div>
        <h3>친구</h3>
        <form id="frAdd"><input type="text" id="frTag" placeholder="이름#1234" autocomplete="off" spellcheck="false"><button type="submit" class="small">추가</button></form>
        <div id="friendList"></div>
        <div id="chatTabs"><button type="button" data-ch="lobby" class="on">로비 채팅</button><button type="button" data-ch="party">파티 채팅</button></div>
        <div id="lobbyLog"></div>
        <form id="lobbyChat"><input type="text" id="lobbyChatIn" maxlength="120" placeholder="메시지" autocomplete="off"></form>
      </section>
    </div>
    <footer class="keys">
      <span><kbd>WASD</kbd> 이동</span><span><kbd>Shift</kbd> 달리기</span><span><kbd>C</kbd> 슬라이딩(달리며)·앉기</span><span><kbd>Space</kbd> 점프·넘어가기</span>
      <span><kbd>좌클릭</kbd> 사격</span><span><kbd>우클릭·T</kbd> 정조준</span><span><kbd>R</kbd> 재장전</span><span><kbd>1·2·휠</kbd> 무기 교체</span>
      <span><kbd>Q·E</kbd> 스킬</span><span><kbd>M</kbd> 전술 지도</span><span><kbd>Tab</kbd> 점수판</span><span><kbd>V</kbd> 3인칭</span><span><kbd>Enter</kbd> 채팅</span>
    </footer>
  </div>
  <div id="stats" class="modal" hidden><div class="mbox"><h3>전적</h3><div id="statsBody"></div><button type="button" id="statsClose">닫기</button></div></div>
</div>

<div class="overlay" id="pause">
  <div class="card">
    <h2>일시정지</h2>
    <div class="sub" style="margin-bottom:0">화면을 클릭하면 전투로 돌아갑니다 (경기는 계속 진행 중)</div>
    <div class="opt" id="optSens"><span>마우스 감도</span><input type="range" id="sens" min="0.2" max="3" step="0.05" value="1"><output id="sensV">1.00</output></div>
    <div class="opt" id="optVol"><span>음량</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.6"><output id="volV">0.60</output></div>
    <button type="button" id="leave">로비로 나가기</button>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
