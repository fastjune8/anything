# FRONTIER: main 에 올리거나 PR 을 열면 전체 테스트를 자동으로 돌린다.
# 라이브 서버와 같은 Node 22 를 쓴다. 브라우저 테스트는 러너에 깔린 Chrome 으로.
name: FRONTIER 테스트

on:
  push:
    branches: [main]
    paths: ['games/frontline/**', '.github/workflows/frontier.yml']
  pull_request:
    paths: ['games/frontline/**', '.github/workflows/frontier.yml']

concurrency:
  group: frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/frontline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/frontline/package-lock.json
      - run: npm ci
      - name: 코드 점검 (eslint)
        run: npm run lint
      - name: 서버·규칙 테스트
        run: npm test
      - name: Chrome 설치
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: 맵 에디터 테스트
        run: node tests/editor.test.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          REQUIRE_CHROME: '1'
      # 게임 화면 테스트는 이동·사격처럼 시간이 흐르는 걸 본다. 그래픽 카드가 없는 GitHub 서버에서는 화면이 1초에 몇 장밖에
      # 안 그려져 게임 시간이 느리게 흘러 실패하므로 참고용으로만 돌린다 (막지 않음). 라이브 배포 전에는 deploy.sh 가 로컬에서 전부 돌린다.
      - name: 게임 화면 테스트 (참고용)
        continue-on-error: true
        run: node tests/browser.test.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          REQUIRE_CHROME: '1'
