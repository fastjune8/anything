# FRONTIER: main 에 올리거나 PR 을 열면 전체 테스트를 자동으로 돌린다.
# 라이브 서버와 같은 Node 22 를 쓴다. 브라우저 테스트는 러너에 깔린 Chrome 으로.
name: FRONTIER 테스트

on:
  push:
    branches: [main]
    paths: ['games/frontline/**', '.github/workflows/frontier.yml']
  pull_request:
    paths: ['games/frontline/**', '.github/workflows/frontier.yml']

concurrency:
  group: frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/frontline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/frontline/package-lock.json
      - run: npm ci
      - name: 코드 점검 (eslint)
        run: npm run lint
      - name: 서버·규칙 테스트
        run: npm test
      - name: Chrome 설치
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: 브라우저 테스트 (게임 + 맵 에디터)
        run: npm run test:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          REQUIRE_CHROME: '1'
